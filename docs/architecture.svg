<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 668" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="668" fill="#ffffff"/>

  <!-- title -->
  <text x="540" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a2530">MOTTAINAI — the agent fleet</text>
  <text x="540" y="58" text-anchor="middle" font-size="14" fill="#5b6b7a">Models perceive and explain. Deterministic code decides.</text>

  <!-- browser zone -->
  <rect x="20" y="95" width="200" height="310" rx="10" fill="#faf8fd" stroke="#6b3fa0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="120" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#6b3fa0">Your browser</text>

  <rect x="35" y="140" width="170" height="96" rx="8" fill="#f4f0fa" stroke="#6b3fa0" stroke-width="1.2"/>
  <text x="120" y="163" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2530">Two snipped screens</text>
  <text x="120" y="182" text-anchor="middle" font-size="11.5" fill="#5b6b7a">Settings › About</text>
  <text x="120" y="198" text-anchor="middle" font-size="11.5" fill="#5b6b7a">drive optimizer</text>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#8a7ba3">(any image works · up to 4)</text>

  <rect x="35" y="300" width="170" height="72" rx="8" fill="#f4f0fa" stroke="#6b3fa0" stroke-width="1.2"/>
  <text x="120" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2530">“I browse, use Excel”</text>
  <text x="120" y="346" text-anchor="middle" font-size="11.5" fill="#5b6b7a">what the machine is</text>
  <text x="120" y="361" text-anchor="middle" font-size="11.5" fill="#5b6b7a">actually used for</text>

  <!-- cloud run zone -->
  <rect x="250" y="95" width="580" height="510" rx="10" fill="#fafcfe" stroke="#4285f4" stroke-width="1.4"/>
  <text x="265" y="119" font-size="13" font-weight="600" fill="#2a63c4">Google Cloud Run — Node.js · Google ADK Workflow</text>
  <text x="265" y="136" font-size="11.5" fill="#5b6b7a">dynamicEntry: the two perception agents run concurrently and join exactly once</text>

  <!-- scanner -->
  <rect x="280" y="150" width="210" height="86" rx="8" fill="#fff3e0" stroke="#d97706" stroke-width="1.4"/>
  <text x="385" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">SCANNER</text>
  <text x="385" y="191" text-anchor="middle" font-size="11.5" fill="#9a5b00">Gemini 3.7 Flash · vision</text>
  <text x="385" y="209" text-anchor="middle" font-size="11.5" fill="#5b6b7a">one call per image</text>
  <text x="385" y="224" text-anchor="middle" font-size="11.5" fill="#5b6b7a">image → readings</text>

  <!-- workload -->
  <rect x="280" y="300" width="210" height="72" rx="8" fill="#fff3e0" stroke="#d97706" stroke-width="1.4"/>
  <text x="385" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">WORKLOAD</text>
  <text x="385" y="341" text-anchor="middle" font-size="11.5" fill="#9a5b00">Gemini 3.7 Flash · text</text>
  <text x="385" y="359" text-anchor="middle" font-size="11.5" fill="#5b6b7a">words → workload profiles</text>

  <!-- data -->
  <rect x="280" y="440" width="210" height="120" rx="8" fill="#e8f2fd" stroke="#0b6bcb" stroke-width="1.4"/>
  <text x="385" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2530">data/parts.json</text>
  <text x="385" y="482" text-anchor="middle" font-size="11.5" fill="#5b6b7a">5,948 CPUs · 3,013 GPUs</text>
  <text x="385" y="497" text-anchor="middle" font-size="11.5" fill="#5b6b7a">(PassMark, sourced per row)</text>
  <text x="385" y="514" text-anchor="middle" font-size="11.5" fill="#5b6b7a">Microsoft Win11 support lists</text>
  <text x="385" y="529" text-anchor="middle" font-size="11.5" fill="#5b6b7a">JP retail prices · workload</text>
  <text x="385" y="544" text-anchor="middle" font-size="11.5" fill="#5b6b7a">thresholds (editorial)</text>

  <!-- merge -->
  <rect x="570" y="150" width="230" height="86" rx="8" fill="#e7f6ed" stroke="#1a7f4b" stroke-width="1.4"/>
  <text x="685" y="173" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">MERGE <tspan fill="#1a7f4b">★ no LLM</tspan></text>
  <text x="685" y="191" text-anchor="middle" font-size="11.5" fill="#5b6b7a">core/merge_scan.js</text>
  <text x="685" y="209" text-anchor="middle" font-size="11.5" fill="#5b6b7a">contradictions surface —</text>
  <text x="685" y="224" text-anchor="middle" font-size="11.5" fill="#5b6b7a">nothing is averaged</text>

  <!-- resolver -->
  <rect x="570" y="266" width="230" height="70" rx="8" fill="#e7f6ed" stroke="#1a7f4b" stroke-width="1.4"/>
  <text x="685" y="289" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">RESOLVER <tspan fill="#1a7f4b">★ no LLM</tspan></text>
  <text x="685" y="307" text-anchor="middle" font-size="11.5" fill="#5b6b7a">core/resolve.js</text>
  <text x="685" y="323" text-anchor="middle" font-size="11.5" fill="#5b6b7a">fuzzy name → canonical part</text>

  <!-- verdict -->
  <rect x="570" y="366" width="230" height="104" rx="8" fill="#e7f6ed" stroke="#1a7f4b" stroke-width="2"/>
  <text x="685" y="391" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">VERDICT ENGINE <tspan fill="#1a7f4b">★ no LLM</tspan></text>
  <text x="685" y="409" text-anchor="middle" font-size="11.5" fill="#5b6b7a">core/verdict.js — deterministic</text>
  <text x="685" y="425" text-anchor="middle" font-size="11.5" fill="#5b6b7a">keep / fix / overkill · real cost</text>
  <text x="685" y="441" text-anchor="middle" font-size="11.5" fill="#5b6b7a">Windows 11 path</text>
  <text x="685" y="459" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a7f4b">127 assertions, npm test</text>

  <!-- narrator -->
  <rect x="570" y="500" width="230" height="80" rx="8" fill="#fff3e0" stroke="#d97706" stroke-width="1.4"/>
  <text x="685" y="523" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a2530">NARRATOR</text>
  <text x="685" y="541" text-anchor="middle" font-size="11.5" fill="#9a5b00">Gemini 3.7 Flash · text</text>
  <text x="685" y="559" text-anchor="middle" font-size="11.5" fill="#5b6b7a">verdict → plain English; never a</text>
  <text x="685" y="574" text-anchor="middle" font-size="11.5" fill="#5b6b7a">number the engine did not produce</text>

  <!-- answer -->
  <rect x="870" y="500" width="190" height="80" rx="8" fill="#f6f8fa" stroke="#5b6b7a" stroke-width="1.4"/>
  <text x="965" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2530">The answer</text>
  <text x="965" y="546" text-anchor="middle" font-size="11.5" fill="#5b6b7a">plus the amount you did</text>
  <text x="965" y="561" text-anchor="middle" font-size="11.5" fill="#5b6b7a">NOT have to spend</text>

  <!-- arrows -->
  <line x1="205" y1="188" x2="280" y2="188" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="205" y1="336" x2="280" y2="336" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="490" y1="193" x2="570" y2="193" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="685" y1="236" x2="685" y2="266" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="685" y1="336" x2="685" y2="366" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="490,336 530,336 530,418 570,418" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="490,500 530,500 530,444 570,444" fill="none" stroke="#0b6bcb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="510,470 545,470 545,301 570,301" fill="none" stroke="#0b6bcb" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="685" y1="470" x2="685" y2="500" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="800" y1="540" x2="870" y2="540" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="20" y="622" width="16" height="16" rx="3" fill="#fff3e0" stroke="#d97706" stroke-width="1.2"/>
  <text x="44" y="635" font-size="12" fill="#1a2530">Gemini 3.7 Flash in the loop (perception &amp; wording only)</text>
  <rect x="400" y="622" width="16" height="16" rx="3" fill="#e7f6ed" stroke="#1a7f4b" stroke-width="1.2"/>
  <text x="424" y="635" font-size="12" fill="#1a2530">deterministic code — everything that touches money</text>
  <rect x="760" y="622" width="16" height="16" rx="3" fill="#e8f2fd" stroke="#0b6bcb" stroke-width="1.2"/>
  <text x="784" y="635" font-size="12" fill="#1a2530">data, each row carrying its source</text>
</svg>
